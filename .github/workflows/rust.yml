name: Rust

on: [push]

env:
  GITHUB_ACTIONS: "true"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build crate
      run: cargo build --all-features --verbose
    - name: Run unit tests
      run: cargo test --all-features --verbose --lib
    - name: Setup SirixDB environment
      run: bash ./prepare-test.sh
    - name: Verify SirixDB authentication
      run: |
        echo "Verifying SirixDB authentication works..."
        timeout=60
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          http_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:9443/token \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin","grant_type":"password"}')
          if [ "$http_code" = "200" ]; then
            echo "SirixDB authentication verified!"
            break
          fi
          echo "Auth not ready yet (HTTP $http_code, ${elapsed}s elapsed), waiting..."
          sleep 3
          elapsed=$((elapsed + 3))
        done
        if [ $elapsed -ge $timeout ]; then
          echo "ERROR: SirixDB authentication did not work within ${timeout}s"
          docker compose -f ./tests/resources/docker-compose.yml logs keycloak
          docker compose -f ./tests/resources/docker-compose.yml logs server
          exit 1
        fi
    - name: Run integration tests (serial to avoid shared state conflicts)
      run: cargo test --all-features --verbose --test sirix -- --test-threads=1
    - name: Teardown
      if: always()
      run: docker compose -f ./tests/resources/docker-compose.yml down -v --remove-orphans 2>/dev/null || true