services:
  keycloak:
    build: .
    ports:
      - 8080:8080
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_LOG_LEVEL=DEBUG
      - KC_IMPORT=/opt/keycloak/data/import/realm-export.json
    restart: always
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    entrypoint: ["/opt/keycloak/scripts/wait-for-keycloak.sh"]
    command: >
      start-dev
      --import-realm
      --http-relative-path=/
      --hostname-strict=false
    networks:
      - auth-network
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8080/realms/master"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s
  server:
    image: sirixdb/sirix
    ports:
      - 9443:9443
    restart: always
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./sirix-conf.json:/opt/sirix/sirix-conf.json
      - ./logback-test.xml:/opt/sirix/sirix-data/logback-test.xml
    networks:
      - auth-network
networks:
  auth-network:
    driver: bridge
